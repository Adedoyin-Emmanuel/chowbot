services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin8080-chowbot
      - POSTGRES_DB=chowbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chowbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev: