<!doctype html>
<!--
  Share card, creative variant. After chowdeck.com's store card: deep green
  with faint rings, a bold stacked line on the left with the last word in
  yellow, one big flat illustration on the right. Here it's a ChowBot speech
  bubble with the food inside: you ask, the food comes.
  Render with `bun og/render.ts` (see that file).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Jakarta";
        src: url("../app/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
        font-weight: 200 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0c513f;
        font-family: "Jakarta", sans-serif;
        color: #fff;
      }
      .abs { position: absolute; }

      .brand {
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .brand img { width: 48px; height: 48px; border-radius: 50%; box-shadow: 0 0 0 3px #ffc501; }

      h1 {
        left: 72px;
        top: 196px;
        font-size: 124px;
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }
      h1 span { color: #ffc501; }

      p {
        left: 76px;
        top: 462px;
        width: 470px;
        font-size: 27px;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.015em;
        color: #ccf3e5;
      }
    </style>
  </head>
  <body>
    <svg class="abs" style="inset: 0" width="1200" height="630" viewBox="0 0 1200 630">
      <!-- Faint rings, like the store card's background. -->
      <g fill="none" stroke="#0f5b47" stroke-width="44">
        <circle cx="120" cy="80" r="190" />
        <circle cx="430" cy="600" r="210" />
        <circle cx="-40" cy="560" r="150" />
        <circle cx="560" cy="40" r="120" />
      </g>

      <g transform="translate(0 -26)">
      <!-- The big speech bubble, ChowBot yellow. -->
      <path d="M770 70h290c64 0 116 52 116 116v196c0 64-52 116-116 116H800l-96 76 18-82c-44-16-68-58-68-110V186c0-64 52-116 116-116z" fill="#ffc501" />
      <path d="M770 70h290c64 0 116 52 116 116v20c0-64-52-116-116-116H770c-64 0-116 52-116 116v-20c0-64 52-116 116-116z" fill="#ffd84d" />

      <!-- Inside: jollof and chicken (JollofArt from components/site/illustrations.tsx). -->
      <svg x="690" y="150" width="440" height="286" viewBox="0 0 400 260">
        <ellipse cx="190" cy="214" rx="168" ry="36" fill="#0c513f" opacity=".2" />
        <ellipse cx="190" cy="200" rx="160" ry="44" fill="#fff" />
        <ellipse cx="190" cy="196" rx="128" ry="30" fill="#f4efe4" />
        <path d="M78 196c8-58 52-92 112-92s104 34 112 92z" fill="#e8642b" />
        <path d="M78 196c4-18 12-34 24-46 6 26 30 40 88 46z" fill="#c94f1d" />
        <g fill="#f7a26b">
          <ellipse cx="130" cy="150" rx="6" ry="3" />
          <ellipse cx="160" cy="132" rx="6" ry="3" transform="rotate(37 160 132)" />
          <ellipse cx="196" cy="124" rx="6" ry="3" transform="rotate(74 196 124)" />
          <ellipse cx="232" cy="136" rx="6" ry="3" transform="rotate(111 232 136)" />
          <ellipse cx="148" cy="172" rx="6" ry="3" transform="rotate(4 148 172)" />
          <ellipse cx="188" cy="160" rx="6" ry="3" transform="rotate(41 188 160)" />
          <ellipse cx="112" cy="180" rx="6" ry="3" transform="rotate(153 112 180)" />
        </g>
        <g fill="#2fa84f">
          <circle cx="176" cy="146" r="5" />
          <circle cx="214" cy="150" r="5" />
          <circle cx="140" cy="162" r="5" />
        </g>
        <g transform="rotate(-24 250 150)">
          <ellipse cx="250" cy="150" rx="40" ry="26" fill="#9a4a1c" />
          <ellipse cx="244" cy="144" rx="28" ry="15" fill="#b8612b" />
          <rect x="286" y="144" width="34" height="11" rx="5" fill="#fff4d6" />
          <circle cx="322" cy="144" r="8" fill="#fff4d6" />
          <circle cx="322" cy="156" r="8" fill="#fff4d6" />
        </g>
        <path d="M58 92c10-20 30-26 46-14-10 4-14 14-12 26-14-2-26-4-34-12z" fill="#e80b2e" />
        <path d="M100 76c6-6 14-8 20-4-6 2-10 6-12 12z" fill="#2fa84f" />
      </svg>

      <!-- A shawarma bursting out of the bubble's top right. -->
      <g transform="rotate(22 1120 110)">
        <circle cx="1100" cy="52" r="16" fill="#2fa84f" />
        <circle cx="1124" cy="46" r="14" fill="#e80b2e" />
        <circle cx="1146" cy="54" r="15" fill="#9a4a1c" />
        <path d="M1078 56h92l-22 150c-2 10-10 16-20 16h-8c-10 0-18-6-20-16z" fill="#e8c08a" />
        <path d="M1090 96l70 0M1094 126l60 0" stroke="#d4a463" stroke-width="5" stroke-linecap="round" />
        <path d="M1098 150h52l-8 54c-2 10-10 18-20 18h-0c-10 0-18-8-20-18z" fill="#c9ced6" />
        <path d="M1100 160h48" stroke="#e7eeec" stroke-width="5" />
      </g>

      <!-- A cold drink at the bubble's bottom left. -->
      <g transform="rotate(-14 650 470)">
        <rect x="624" y="410" width="54" height="120" rx="14" fill="#e80b2e" />
        <rect x="638" y="388" width="26" height="30" rx="6" fill="#e80b2e" />
        <rect x="635" y="378" width="32" height="12" rx="4" fill="#101b17" />
        <rect x="624" y="448" width="54" height="32" fill="#fff" />
        <circle cx="651" cy="464" r="9" fill="#e80b2e" />
      </g>

      </g>

      <!-- Sparkles. -->
      <g>
        <path transform="translate(1150 360) scale(1.6)" fill="#fff" d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" />
        <path transform="translate(620 120) scale(1.3)" fill="#02c27f" d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" />
        <path transform="translate(600 300) scale(.8)" fill="#ffc501" d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" />
      </g>

      <!-- Rider speeding off under the bubble. -->
      <svg x="930" y="496" width="200" height="137" viewBox="0 0 400 260">
        <path d="M20 120h60M8 150h70M30 180h46" stroke="#ccf3e5" stroke-width="8" stroke-linecap="round" />
        <rect x="96" y="70" width="86" height="80" rx="10" fill="#ffc501" />
        <rect x="96" y="70" width="86" height="20" rx="8" fill="#e0a800" />
        <rect x="126" y="104" width="26" height="26" rx="13" fill="#0c513f" />
        <path d="M110 160h150l40-30h34l-8 22-46 58H130z" fill="#02c27f" />
        <path d="M300 130l-20-62" stroke="#101b17" stroke-width="10" stroke-linecap="round" />
        <path d="M268 66h34" stroke="#101b17" stroke-width="10" stroke-linecap="round" />
        <path d="M184 72c4-20 24-30 42-24l14 52-44 14z" fill="#fff4d6" />
        <path d="M228 98l46-12" stroke="#fff4d6" stroke-width="18" stroke-linecap="round" />
        <path d="M196 112l40 6 10 42h-22l-6-26-30 0z" fill="#101b17" />
        <circle cx="226" cy="34" r="26" fill="#ffc501" />
        <path d="M200 34a26 26 0 0152 0z" fill="#e0a800" />
        <rect x="226" y="30" width="30" height="12" rx="6" fill="#101b17" opacity=".8" />
        <circle cx="140" cy="214" r="30" fill="#101b17" />
        <circle cx="140" cy="214" r="12" fill="#cfd8d4" />
        <circle cx="312" cy="214" r="30" fill="#101b17" />
        <circle cx="312" cy="214" r="12" fill="#cfd8d4" />
      </svg>
    </svg>

    <div class="abs brand">
      <img src="../public/chowbot-logo.svg" alt="" />
      ChowBot
    </div>

    <h1 class="abs">Ask. Pay.<br /><span>Chow.</span></h1>

    <p class="abs">Chowdeck food, ordered from Claude, ChatGPT and more.</p>
  </body>
</html>
