<!doctype html>
<!--
  Share card, illustrated variant. Laid out like chowdeck.com's own: cream
  sky, one bold centred line, a flat city below. Same art as the hero
  (components/site/illustrations.tsx), with the ChowBot robot in the middle.
  Render with `bun og/render.ts` (see that file).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Jakarta";
        src: url("../app/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
        font-weight: 200 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #fff4d6;
        font-family: "Jakarta", sans-serif;
        color: #101b17;
      }
      .abs { position: absolute; }

      .brand {
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #0c513f;
      }
      .brand img { width: 44px; height: 44px; }

      h1 {
        left: 0;
        right: 0;
        top: 104px;
        text-align: center;
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 1;
        color: #000;
      }

      .road {
        left: 0;
        right: 0;
        bottom: 0;
        height: 46px;
        background:
          linear-gradient(90deg, #fff 0 46px, transparent 46px 92px) 0 21px / 92px 4px repeat-x,
          #55635d;
        border-top: 6px solid #cfd8d4;
      }
    </style>
  </head>
  <body>
    <!-- Clouds, after the ones in the hero (components/site/shapes.tsx). -->
    <svg class="abs" style="left: -60px; top: -14px; width: 300px" viewBox="0 0 220 90">
      <path fill="#fff" stroke="#fde7b0" stroke-width="6" d="M30 84c-15 0-26-10-26-23s11-23 26-23c2-17 17-30 35-30 12 0 23 6 29 15 5-4 12-7 19-7 15 0 28 11 30 25 4-2 9-3 13-3 17 0 31 13 31 29 0 9-7 17-17 17z" />
    </svg>
    <svg class="abs" style="right: -50px; top: 30px; width: 260px" viewBox="0 0 220 90">
      <path fill="#fff" stroke="#fde7b0" stroke-width="6" d="M30 84c-15 0-26-10-26-23s11-23 26-23c2-17 17-30 35-30 12 0 23 6 29 15 5-4 12-7 19-7 15 0 28 11 30 25 4-2 9-3 13-3 17 0 31 13 31 29 0 9-7 17-17 17z" />
    </svg>
    <svg class="abs" style="left: 330px; top: 228px; width: 120px" viewBox="0 0 220 90">
      <path fill="#fff" stroke="#fde7b0" stroke-width="6" d="M30 84c-15 0-26-10-26-23s11-23 26-23c2-17 17-30 35-30 12 0 23 6 29 15 5-4 12-7 19-7 15 0 28 11 30 25 4-2 9-3 13-3 17 0 31 13 31 29 0 9-7 17-17 17z" />
    </svg>
    <svg class="abs" style="right: 300px; top: 250px; width: 100px" viewBox="0 0 220 90">
      <path fill="#fff" stroke="#fde7b0" stroke-width="6" d="M30 84c-15 0-26-10-26-23s11-23 26-23c2-17 17-30 35-30 12 0 23 6 29 15 5-4 12-7 19-7 15 0 28 11 30 25 4-2 9-3 13-3 17 0 31 13 31 29 0 9-7 17-17 17z" />
    </svg>

    <!-- Skyline: SkylineArt from components/site/illustrations.tsx. -->
    <svg id="skyline" class="abs" style="left: 0; bottom: 46px; width: 1200px; height: 360px" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice"></svg>

    <!-- ChowBot, waving, with a Chowdeck bag. -->

      <circle cx="165" cy="16" r="13" fill="#ffc501" />
      <rect x="48" y="88" width="24" height="52" rx="10" fill="#ffc501" />
      <rect x="258" y="88" width="24" height="52" rx="10" fill="#ffc501" />
      <rect x="66" y="48" width="198" height="130" rx="48" fill="#ffc501" />
      <rect x="90" y="68" width="150" height="90" rx="34" fill="#0c513f" />
      <circle cx="134" cy="106" r="13" fill="#ffc501" />
      <circle cx="196" cy="106" r="13" fill="#ffc501" />
      <path d="M144 130q21 16 42 0" fill="none" stroke="#ffc501" stroke-width="8" stroke-linecap="round" />
    </svg>

    <!-- Sparkles around ChowBot. -->
    <svg class="abs" style="left: 410px; top: 300px; width: 34px" viewBox="0 0 24 24"><path fill="#ffc501" d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" /></svg>
    <svg class="abs" style="left: 770px; top: 270px; width: 42px" viewBox="0 0 24 24"><path fill="#02c27f" d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" /></svg>
    <svg class="abs" style="left: 805px; top: 335px; width: 22px" viewBox="0 0 24 24"><path fill="#ed5e3b" d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" /></svg>

    <div class="abs road"></div>

    <!-- Rider on the road. -->
    <svg class="abs" style="left: 820px; bottom: 4px; width: 190px" viewBox="0 0 400 260">
      <path d="M20 120h60M8 150h70M30 180h46" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8" />
      <rect x="96" y="70" width="86" height="80" rx="10" fill="#0c513f" />
      <rect x="96" y="70" width="86" height="20" rx="8" fill="#083b2e" />
      <rect x="126" y="104" width="26" height="26" rx="13" fill="#ffc501" />
      <path d="M110 160h150l40-30h34l-8 22-46 58H130z" fill="#02c27f" />
      <path d="M300 130l-20-62" stroke="#101b17" stroke-width="10" stroke-linecap="round" />
      <path d="M268 66h34" stroke="#101b17" stroke-width="10" stroke-linecap="round" />
      <path d="M184 72c4-20 24-30 42-24l14 52-44 14z" fill="#0c9f6a" />
      <path d="M228 98l46-12" stroke="#0c9f6a" stroke-width="18" stroke-linecap="round" />
      <path d="M196 112l40 6 10 42h-22l-6-26-30 0z" fill="#101b17" />
      <circle cx="226" cy="34" r="26" fill="#ffc501" />
      <path d="M200 34a26 26 0 0152 0z" fill="#e0a800" />
      <rect x="226" y="30" width="30" height="12" rx="6" fill="#101b17" opacity=".8" />
      <circle cx="140" cy="214" r="30" fill="#101b17" />
      <circle cx="140" cy="214" r="12" fill="#cfd8d4" />
      <circle cx="312" cy="214" r="30" fill="#101b17" />
      <circle cx="312" cy="214" r="12" fill="#cfd8d4" />
    </svg>

    <div class="abs brand">
      <img src="../public/chowbot-logo.svg" alt="" />
      ChowBot
    </div>

    <h1 class="abs">Ordering food, made easy.</h1>

    <script src="skyline.js"></script>
    <script>
      drawSkyline({ ground: 384, trees: [[30, 356, 1], [250, 364, 1.1], [420, 372, 0.9], [1150, 362, 1.1], [1380, 364, 1]] });
    </script>
  </body>
</html>
